subject: 高中地理
taxonomy_name: 自然地理知识点体系（选择性必修1）
version: v0.1-review
status: draft_for_manual_review
source:
  textbook: 普通高中教科书·地理选择性必修1 自然地理基础
  publisher: 人民教育出版社
  source_file: D:/桌面/地理课本/高中/普通高中教科书·地理选择性必修1 自然地理基础.pdf
  basis: 依据教材目录、章节标题和正文主题整理，供人工检查后作为后续题目自动标注标准词表

notes:
  - 本文件采用三级结构：学科模块 -> 一级知识点 -> 二级知识点。
  - 学科模块基本对应教材章名，一级知识点基本对应教材节名或核心主题。
  - 二级知识点用于后续题目打标签、Obsidian 双链和教学网站筛选。
  - 本版是初稿，允许根据高考题和教学需要合并、拆分、重命名。
  - 自动标注时应优先使用本文件中的标准名称，避免同义词造成图谱分裂。

